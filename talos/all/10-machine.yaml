# yaml-language-server: $schema=https://raw.githubusercontent.com/siderolabs/talos/refs/heads/main/pkg/machinery/config/schemas/config.schema.json
# Cluster PKI, tokens, discovery identity, and component images are generated by topf from the
# secrets bundle and topf.yaml.
---
machine:
  certSANs:
    - 127.0.0.1
    - 192.168.1.70
  features:
    diskQuotaSupport: true
---
apiVersion: v1alpha1
kind: DiscoveryServiceConfig
name: default
endpoint: https://discovery.talos.dev/
---
apiVersion: v1alpha1
kind: VolumeConfig
name: EPHEMERAL
mount:
  secure: true
---
apiVersion: v1alpha1
kind: FilesystemTrimConfig
interval: 168h
---
apiVersion: v1alpha1
kind: SecurityProfileConfig
workloadIsolation: true
---
apiVersion: v1alpha1
kind: ResolverConfig
nameservers:
  - address: 1.1.1.1
  - address: 1.0.0.1
searchDomains:
  domains: []
  disableDefault: true
hostDNS:
  enabled: true
  forwardKubeDNSToHost: false
---
apiVersion: v1alpha1
kind: TimeSyncConfig
ntp:
  servers:
    - 162.159.200.1
    - 162.159.200.123
---
apiVersion: v1alpha1
kind: CRICustomizationConfig
name: containerd
content: |
  [plugins."io.containerd.cri.v1.images"]
    discard_unpacked_layers = false
  [plugins."io.containerd.cri.v1.runtime"]
    cdi_spec_dirs = ["/var/cdi/static", "/var/cdi/dynamic"]
    device_ownership_from_security_context = true
---
apiVersion: v1alpha1
kind: SysctlConfig
params:
  fs.inotify.max_user_instances: "8192"
  fs.inotify.max_user_watches: "1048576"
  net.core.rmem_max: "67108864"
  net.core.wmem_max: "67108864"
  net.ipv4.tcp_fastopen: "3"
  net.ipv4.tcp_mtu_probing: "1"
  net.ipv4.tcp_rmem: 4096 262144 67108864
  net.ipv4.tcp_slow_start_after_idle: "0"
  net.ipv4.tcp_wmem: 4096 262144 67108864
  user.max_user_namespaces: "11255"
---
apiVersion: v1alpha1
kind: KubeNodeConfig
nodeIP:
  validSubnets:
    - 192.168.1.0/24
---
apiVersion: v1alpha1
kind: KubeletConfig
config:
  featureGates:
    ResourceHealthStatus: true
  serializeImagePulls: false
  volumeStatsAggPeriod: 1m
  imageMaximumGCAge: 168h
  imageGCHighThresholdPercent: 50
  imageGCLowThresholdPercent: 20
defaultRuntimeSeccompProfileEnabled: true
---
apiVersion: v1alpha1
kind: KubeNetworkConfig
dnsDomain: cluster.local
podSubnets:
  - 10.42.0.0/16
serviceSubnets:
  - 10.43.0.0/16
---
apiVersion: v1alpha1
kind: KubePrismConfig
port: 7445
---
# Cilium is the CNI; Talos must not deploy its default Flannel.
apiVersion: v1alpha1
kind: KubeFlannelCNIConfig
$patch: delete
