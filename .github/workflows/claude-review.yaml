---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Claude Review

# Claude reviews Renovate PRs that change cluster configuration, plus any PR labeled
# claude/review. Instructions: AGENTS.md and .claude/renovate-review.md from the base branch, so a
# PR cannot change its own review. The model never merges; the gate step below owns auto-merge and
# maintainer notification.
#
# Manual test runs use the workflow and instructions from the dispatched branch against any open
# PR, and only print what the merge gate would do:
#   gh workflow run claude-review.yaml --ref <branch> -f pr=<number>

on:
  pull_request:
    types:
    - opened
    - synchronize
    - labeled
  workflow_dispatch:
    inputs:
      pr:
        description: Open PR number to review
        required: true
        type: number

permissions: {}

jobs:
  review:
    # Renovate events: only Renovate PRs and only Renovate's own pushes, so pushes by Claude or a
    # maintainer never start a review. The self-hosted bot (renova-chan) also adopted PRs that the
    # Mend app (renovate[bot]) opened, so either may be the PR author. Label events: only the
    # review label. Labels such as risk/high or status/hold never skip the review; they only block
    # auto-merge below.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.action == 'labeled' && github.event.label.name == 'claude/review') ||
      (github.event.action != 'labeled' &&
        contains(fromJSON('["renovate[bot]","renova-chan[bot]"]'),
          github.event.pull_request.user.login) &&
        github.event.sender.login == 'renova-chan[bot]')
    name: Claude Review
    runs-on: ubuntu-latest
    concurrency:
      group: claude-review-${{ github.event.pull_request.number || inputs.pr }}
      cancel-in-progress: true
    permissions:
      actions: read
      contents: write
      id-token: write
      pull-requests: write
    env:
      PR: ${{ github.event.pull_request.number || inputs.pr }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' }}
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
    - name: Resolve PR
      run: |-
        gh pr view "$PR" --json state,headRefName,headRefOid,baseRefName --jq '
          "STATE=\(.state)", "HEAD_REF=\(.headRefName)", "HEAD_SHA=\(.headRefOid)",
          "BASE_REF=\(.baseRefName)"' >> "$GITHUB_ENV"

    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ env.HEAD_REF }}
        fetch-depth: 0
        persist-credentials: false

    # A Renovate rebase that leaves the PR's own patch unchanged reuses a prior safe, high-confidence
    # verdict instead of a new review; the merge gate still runs against the new head. The Record
    # review step stores each verdict with the patch it reviewed.
    - name: Check scope
      id: scope
      env:
        ACTION: ${{ github.event.action }}
      run: |-
        if [[ "$STATE" != OPEN ]]; then
          echo "PR $PR is $STATE; skipping review"
          exit 0
        fi
        if [[ "$ACTION" != labeled && "$DRY_RUN" != true ]] \
          && ! git diff --name-only "origin/${BASE_REF}...HEAD" | grep -qE '^(kubernetes|talos)/'; then
          echo "No cluster configuration changes; skipping review"
          exit 0
        fi

        patch_id=$(git diff "origin/${BASE_REF}...HEAD" | git patch-id --stable | cut -d' ' -f1)
        echo "patch_id=$patch_id"
        { echo "gate=true"; echo "patch_id=$patch_id"; } >> "$GITHUB_OUTPUT"

        prior=""
        if [[ "$ACTION" == synchronize ]]; then
          prior=$(gh api --method GET --paginate "repos/{owner}/{repo}/issues/$PR/comments" --jq '
            .[] | select(.user.login == "github-actions[bot]") | .body
            | capture("<!-- claude-review (?<s>\\{[^}]*\\}) -->").s' | tail -n 1)
        fi
        echo "prior=${prior:-none}"
        if [[ -n "$prior" ]] && jq -e --arg p "$patch_id" \
          '.patch_id == $p and .verdict == "safe" and .confidence == "high"' <<< "$prior" >/dev/null
        then
          echo "Patch unchanged since a safe, high-confidence review; reusing the verdict"
          jq -c --arg sha "$HEAD_SHA" '{verdict, confidence, reviewed_sha: $sha}' <<< "$prior" \
            | sed 's/^/reused=/' >> "$GITHUB_OUTPUT"
        else
          echo "review=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Setup flate
      if: steps.scope.outputs.review == 'true'
      uses: home-operations/flate/action@bbb6ebc344da051752dbdb1b413860ceffcfb63d # v0.7.3
      with:
        cache: true

    - name: Setup helm
      if: steps.scope.outputs.review == 'true'
      uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      with:
        version: v4.3.1

    - name: Setup crane
      if: steps.scope.outputs.review == 'true'
      uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b # v0.7

    - name: Setup pre-commit
      if: steps.scope.outputs.review == 'true'
      run: pipx install pre-commit

    # Claude Code's AGENTS.md loading is not visible in the transcript, so both instruction files
    # are passed explicitly and their blob hashes logged for retrospectives. PR events read them
    # from the base branch; manual runs read them from the dispatched branch.
    - name: Build instructions
      if: steps.scope.outputs.review == 'true'
      run: |-
        source="origin/${BASE_REF}"
        [[ "$DRY_RUN" == true ]] && source="$GITHUB_SHA"
        for file in AGENTS.md .claude/renovate-review.md; do
          git rev-parse "${source}:${file}" >&2
          git show "${source}:${file}"
          echo
        done > "$RUNNER_TEMP/instructions.md"

    - name: Review
      id: claude
      if: steps.scope.outputs.review == 'true'
      uses: anthropics/claude-code-action@61a9c274fa7110a66dfafc1bbbced03833eb25fe # v1.0.269
      with:
        claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        # The Claude App rejects workflow files that differ from main, so manual runs from a test
        # branch use the job token; Claude's pushes then do not start other workflows
        github_token: ${{ github.event_name == 'workflow_dispatch' && github.token || '' }}
        allowed_bots: renova-chan[bot],renovate[bot]
        prompt: |
          Review this Renovate PR following your system instructions.
          REPO: ${{ github.repository }}
          PR NUMBER: ${{ env.PR }}
          HEAD SHA: ${{ env.HEAD_SHA }}
          RUN URL: ${{ env.RUN_URL }}
        claude_args: >-
          --model claude-opus-5-5
          --effort high
          --append-system-prompt-file ${{ runner.temp }}/instructions.md
          --json-schema '{"type":"object","additionalProperties":false,
          "required":["verdict","confidence","reviewed_sha","summary"],"properties":{
          "verdict":{"enum":["safe","decide","adopted","fixed","blocked"]},
          "confidence":{"enum":["high","medium","low"]},
          "reviewed_sha":{"type":"string"},"summary":{"type":"string"}}}'
        # All tools are allowed: a command list cannot stop prompt injection, since file reads and
        # PR comments alone can leak tokens. The merge gate below is the safety boundary.
        settings: |
          {
            "showThinkingSummaries": true,
            "permissions": {
              "allow": ["Bash", "Read", "Glob", "Grep", "Edit", "Write", "WebFetch", "WebSearch"]
            }
          }

    # Full transcript for retrospectives, one JSON message per line. Logs, unlike artifacts, get
    # GitHub's secret masking. Read it with the job logs API; `gh run view --log` drops lines:
    #   gh api --method GET --allow-escape-sequences repos/{owner}/{repo}/actions/jobs/<id>/logs
    - name: Print transcript
      if: ${{ !cancelled() && steps.claude.outputs.execution_file }}
      env:
        EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
      run: jq -c '.[]' "$EXECUTION_FILE"

    # Merge gate: auto-merge only a high-confidence safe verdict on the exact reviewed commit, and
    # never majors, high-risk, or held PRs. Everything else goes to the maintainer.
    - name: Apply verdict
      id: verdict
      if: ${{ !cancelled() && steps.scope.outputs.gate == 'true' }}
      env:
        OUTPUT: ${{ steps.claude.outputs.structured_output || steps.scope.outputs.reused }}
        PATCH_ID: ${{ steps.scope.outputs.patch_id }}
        OWNER: ${{ github.repository_owner }}
      run: |-
        # Manual runs only print the gate's actions
        gh() {
          if [[ "$DRY_RUN" == true && "$1 $2" != "pr view" ]]; then
            echo "dry run: gh $*"
          else
            command gh "$@"
          fi
        }
        # Missing or unparsable output counts as blocked
        field() { jq -r --arg k "$1" '.[$k] // ""' <<< "$OUTPUT" 2>/dev/null || true; }
        verdict=$(field verdict)
        confidence=$(field confidence)
        reviewed=$(field reviewed_sha)
        pr_json=$(gh pr view "$PR" --json headRefOid,labels)
        head=$(jq -r .headRefOid <<< "$pr_json")
        held=$(jq -r '[.labels[].name]
          | map(select(. == "type/major" or . == "risk/high" or . == "status/hold"))
          | length' <<< "$pr_json")
        echo "verdict=${verdict:-none} confidence=${confidence:-none} reviewed=${reviewed:-none}"
        echo "head=$head held_labels=$held"
        marker=$(jq -nc --arg p "$PATCH_ID" --arg v "${verdict:-none}" \
          --arg c "${confidence:-none}" '{patch_id: $p, verdict: $v, confidence: $c}')
        {
          echo "record<<EOF_RECORD"
          echo "<!-- claude-review $marker -->"
          echo "Claude review of patch \`$PATCH_ID\`: verdict ${verdict:-none}," \
            "confidence ${confidence:-none}. Rebases that keep this patch reuse a safe," \
            "high-confidence verdict."
          echo "EOF_RECORD"
        } >> "$GITHUB_OUTPUT"

        result="verdict ${verdict:-none}, confidence ${confidence:-none}"
        if [[ "$verdict" == safe && "$confidence" == high && "$reviewed" == "$head" \
          && "$held" == 0 ]]; then
          # Concurrent merges into the base branch reset every open PR's merge state to UNKNOWN
          # and fail in-flight merges, so the gate retries. It picks direct merge or auto-merge
          # from the state it read: GitHub rejects auto-merge for an already-mergeable PR, and
          # gh makes the same choice from its own, possibly UNKNOWN, read.
          for attempt in {1..5}; do
            for _ in {1..12}; do
              state=$(gh pr view "$PR" --json mergeStateStatus --jq .mergeStateStatus)
              [[ "$state" != UNKNOWN ]] && break
              sleep 5
            done
            echo "attempt=$attempt merge_state=$state"
            case "$state" in
              CLEAN | HAS_HOOKS | UNSTABLE) mode=() ;;
              DIRTY) result="$result, merge conflict" && break ;;
              *) mode=(--auto) ;;
            esac
            if gh pr merge "$PR" "${mode[@]}" --squash --match-head-commit "$head"; then
              if jq -e '[.labels[].name] | index("claude/needs-review")' <<< "$pr_json" \
                >/dev/null; then
                gh pr edit "$PR" --remove-label claude/needs-review
              fi
              exit 0
            fi
            sleep 10
          done
          [[ "$state" == DIRTY ]] || result="$result, merge failed"
        fi

        gh pr edit "$PR" --add-label claude/needs-review
        # A mention, unlike a review request, cannot be triggered by team or CODEOWNERS rules, so
        # notification filters can trust it
        gh pr comment "$PR" --body "@${OWNER} needs review: ${result}; run ${RUN_URL}"

    # Check scope reads the JSON marker to decide whether a rebase can reuse this verdict
    - name: Record review
      if: ${{ !cancelled() && steps.scope.outputs.review == 'true' && env.DRY_RUN != 'true' }}
      uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
      with:
        header: claude-review
        number: ${{ env.PR }}
        message: ${{ steps.verdict.outputs.record }}

    - name: Remove review label
      if: ${{ always() && github.event.action == 'labeled' }}
      run: gh pr edit "$PR" --remove-label claude/review
