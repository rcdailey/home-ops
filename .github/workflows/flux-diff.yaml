---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Flux Diff

on:
  pull_request:
    branches:
    - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLATE_SUPPLY: .flate/cluster-secrets.yaml

jobs:
  filter:
    name: Flux Diff - Filter
    runs-on: ubuntu-latest
    outputs:
      changed-files: ${{ steps.changed-files.outputs.changed_files }}
    steps:
    - name: Get Changed Files
      id: changed-files
      uses: bjw-s-labs/action-changed-files@147be9638332cf68fd60714a610509d7a9360d60 # v0.7.0
      with:
        patterns: kubernetes/**/*

  test:
    if: ${{ needs.filter.outputs.changed-files != '[]' }}
    needs: filter
    name: Flux Diff - Test
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Setup flate
      uses: home-operations/flate/action@f7e0888c400e73901f64e1f8ae05b0def363f697 # v0.7.0
      with:
        cache: true

    - name: Run flate test
      run: flate test all -p ./kubernetes/apps

  deprecations:
    if: ${{ needs.filter.outputs.changed-files != '[]' }}
    needs: filter
    name: Flux Diff - Deprecations
    runs-on: ubuntu-latest
    env:
      # renovate: datasource=github-releases depName=FairwindsOps/pluto
      PLUTO_VERSION: v5.24.5
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # The flate action sets FLATE_BASE=main, which every flate command resolves
        fetch-depth: 0
        persist-credentials: false

    - name: Setup flate
      uses: home-operations/flate/action@f7e0888c400e73901f64e1f8ae05b0def363f697 # v0.7.0
      with:
        cache: true

    - name: Install pluto
      env:
        GH_TOKEN: ${{ github.token }}
      run: |-
        gh release download "$PLUTO_VERSION" --repo FairwindsOps/pluto \
          --pattern "pluto_${PLUTO_VERSION#v}_linux_amd64.tar.gz" --pattern checksums.txt
        sha256sum --check --ignore-missing checksums.txt
        tar -xzf "pluto_${PLUTO_VERSION#v}_linux_amd64.tar.gz" pluto
        sudo install pluto /usr/local/bin/pluto

    - name: Detect deprecated APIs
      run: |-
        kube_version=$(grep -oP '^kubectl = "\K[^"]+' .mise.toml)
        # Helm's offline capabilities omit aggregated APIs; without this, charts that probe for
        # apiregistration.k8s.io/v1 fall back to the removed v1beta1 and fail the check
        flate build all -p ./kubernetes/apps --no-progress --kube-version "$kube_version" \
          --api-versions apiregistration.k8s.io/v1 > rendered.yaml
        pluto detect rendered.yaml --target-versions "k8s=v${kube_version}" -o wide

  diff:
    if: ${{ needs.filter.outputs.changed-files != '[]' }}
    needs: filter
    name: Flux Diff - Diff
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    strategy:
      matrix:
        resource:
        - hr
        - ks
      fail-fast: false
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Setup flate
      uses: home-operations/flate/action@f7e0888c400e73901f64e1f8ae05b0def363f697 # v0.7.0
      with:
        cache: true

    - name: Run flate diff
      id: diff
      run: |-
        diff=$(flate diff ${{ matrix.resource }} -p ./kubernetes/apps \
          --output diff \
          --strip-attr helm.sh/chart \
          --strip-attr checksum/config \
          --strip-attr app.kubernetes.io/version \
          --strip-attr chart)
        echo 'diff<<EOF' >> "$GITHUB_OUTPUT"
        echo "$diff" >> "$GITHUB_OUTPUT"
        echo 'EOF' >> "$GITHUB_OUTPUT"

    - if: ${{ steps.diff.outputs.diff != '' }}
      name: Add Comment
      uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
      with:
        header: ${{ github.event.pull_request.number }}/kubernetes/${{ matrix.resource }}
        message: |-
          ```diff
          ${{ steps.diff.outputs.diff }}
          ```

  success:
    if: ${{ !cancelled() }}
    needs:
    - test
    - deprecations
    - diff
    name: Flux Diff - Success
    runs-on: ubuntu-latest
    steps:
    - name: Any jobs failed?
      if: ${{ contains(needs.*.result, 'failure') }}
      run: exit 1

    - name: All jobs passed or skipped?
      if: ${{ !(contains(needs.*.result, 'failure')) }}
      run: echo "All jobs passed or skipped" && echo "${{ toJSON(needs.*.result) }}"
