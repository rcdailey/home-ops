---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Claude

# Answers @claude mentions in PR comments and reviews: questions, explanations, and follow-up
# changes pushed to the PR branch. Only users with write access can trigger it. It never merges.

on:
  # Top-level PR comments only arrive as issue_comment. The action rejects commenters without
  # write access before it checks out the PR; the checkout step only reads the default branch.
  issue_comment: # zizmor: ignore[dangerous-triggers]
    types:
    - created
  pull_request_review_comment:
    types:
    - created
  pull_request_review:
    types:
    - submitted

permissions: {}

jobs:
  claude:
    if: >-
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
        contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' &&
        contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' &&
        contains(github.event.review.body, '@claude'))
    name: Claude
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      id-token: write
      issues: write
      pull-requests: write
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Setup flate
      uses: home-operations/flate/action@631b76b69c4e58c6f4d1cb01e23616fa61aebafa # v0.6.5
      with:
        cache: true

    - name: Setup helm
      uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      with:
        version: v4.3.1

    - name: Setup crane
      uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b # v0.7

    - name: Setup pre-commit
      run: pipx install pre-commit

    - name: Respond
      id: claude
      uses: anthropics/claude-code-action@61a9c274fa7110a66dfafc1bbbced03833eb25fe # v1.0.269
      with:
        claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        claude_args: >-
          --model claude-opus-5-5
          --effort high
        # Keep in sync with claude-review.yaml
        settings: |
          {
            "permissions": {
              "allow": [
                "Read", "Glob", "Grep", "Edit", "Write", "WebFetch", "WebSearch",
                "Bash(gh pr view:*)", "Bash(gh pr diff:*)", "Bash(gh pr checks:*)",
                "Bash(gh pr comment:*)", "Bash(gh release view:*)", "Bash(gh release list:*)",
                "Bash(gh run view:*)", "Bash(gh api --method GET:*)",
                "Bash(git log:*)", "Bash(git show:*)", "Bash(git diff:*)", "Bash(git status:*)",
                "Bash(git fetch:*)", "Bash(git add:*)", "Bash(git commit:*)", "Bash(git push:*)",
                "Bash(helm show:*)", "Bash(helm template:*)", "Bash(helm pull:*)",
                "Bash(crane config:*)", "Bash(crane manifest:*)", "Bash(crane ls:*)",
                "Bash(crane digest:*)", "Bash(flate:*)", "Bash(pre-commit run:*)",
                "Bash(jq:*)", "Bash(yq:*)", "Bash(diff:*)", "Bash(grep:*)", "Bash(ls:*)",
                "Bash(head:*)", "Bash(tail:*)", "Bash(wc:*)", "Bash(sort:*)", "Bash(cut:*)"
              ]
            }
          }

    # Keep in sync with claude-review.yaml
    - name: Print transcript
      if: ${{ !cancelled() && steps.claude.outputs.execution_file }}
      env:
        EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
      run: jq -c '.[]' "$EXECUTION_FILE"
