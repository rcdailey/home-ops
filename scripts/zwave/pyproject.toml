[project]
name = "zwave"
version = "0.1.0"
description = "LLM-optimized Z-Wave JS server API wrapper"
requires-python = ">=3.13"
dependencies = [
    "click>=8.5",
    "websockets>=17.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["zwave"]
