[project]
name = "opensprinkler"
version = "0.1.0"
description = "LLM-optimized OpenSprinkler controller API wrapper"
requires-python = ">=3.13"
dependencies = ["click>=8.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["opensprinkler"]
