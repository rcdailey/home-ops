[project]
name = "hass"
version = "0.1.0"
description = "LLM-optimized Home Assistant API wrapper"
requires-python = ">=3.13"
dependencies = [
    "click>=8.5",
    "homeassistant-api>=6.1",
    "aiohttp>=3.14",
    "pyyaml>=6.0.3",
    "python-slugify>=9.1",
    "requests>=2.34",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hass"]
