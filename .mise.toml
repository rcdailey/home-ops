[settings]
# age-encrypted [env] values require experimental features
experimental = true
age.key_file = "age.txt"

[env]
KUBECONFIG = "{{config_root}}/kubeconfig"
MINIJINJA_CONFIG_FILE = "{{config_root}}/.minijinja.toml"
TALOSCONFIG = "{{config_root}}/talos/talosconfig"
DIFFTOOL = "delta"
FLATE_PATH = "{{config_root}}/kubernetes/flux/cluster"

[plugins]
krew = "https://github.com/soupglasses/mise-krew"

[tools]
crane = "latest"
delta = "latest"
flux2 = "2.9.6"
fzf = "latest"
gh = "latest"
gitleaks = "latest"
gum = "latest"
helm = "4.3.1"
helmfile = "latest"
infisical = "latest"
jq = "latest"
just = "latest"
kubectl = "1.37.1"
"krew:cnpg" = "latest"
# Not in the official krew index yet; kubectl discovers plugins by the kubectl-kopiur name
"github:home-operations/kopiur" = { version = "latest", rename_exe = "kubectl-kopiur" }
# mise "latest" skips prereleases and resolves to the obsolete 0.x line
"npm:cf" = "1.0.0-beta.21"
"npm:@doist/outline-cli" = { version = "latest", allow_low_downloads = true }
kustomize = "latest"
markdownlint-cli2 = "latest"
"github:mitsuhiko/minijinja" = "latest"
"npm:renovate" = {
    version = "latest",
    trust_policy_excludes = [
      "@yarnpkg/libzip@3.2.2",
      "fastq@1.20",
    ],
}
pre-commit = "latest"
"pipx:ttok" = "1.0"
python = "3.14"
ripgrep = "latest"
ruff = "latest"
shellcheck = "latest"
shfmt = "latest"
talosctl = "1.14.4"
"github:postfinance/topf" = "latest"
"github:simulot/immich-go" = "latest"
"github:home-operations/flate" = "latest"
"github:home-operations/yayamlls" = "latest"
"github:hyperb1iss/unifly" = "latest"
"github:nklmilojevic/sofka" = "latest"
yamlfmt = "latest"
yamllint = "latest"
yq = "latest"
