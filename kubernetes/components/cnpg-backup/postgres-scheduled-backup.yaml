# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/postgresql.cnpg.io/scheduledbackup_v1.json
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: ${APP}-postgres-backup
spec:
  # 03:00 never repeats or is skipped by DST; a repeated hour reuses the backup name and
  # leaves the schedule stuck retrying it
  schedule: "0 0 3 * * *"
  backupOwnerReference: self
  cluster:
    name: ${APP}-postgres
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  target: "prefer-standby"
  immediate: true
