# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tuppr
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: tuppr
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    replicaCount: 2
    # Connection only; which alerts get silenced is authored per-run on
    # TalosUpgrade.spec.silences. VMAlertmanager speaks the v2 silences API and
    # requires no auth in-cluster, so no header secret is needed.
    silences:
      enabled: true
      alertmanager:
        address: http://vmalertmanager-victoria-metrics-k8s-stack.observability:9093
