apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ./helmrelease.yaml
- ./oidcclient.yaml
configMapGenerator:
- name: garage-ui-config
  files:
  - config.yaml=./config/config.yaml
generatorOptions:
  disableNameSuffixHash: true
