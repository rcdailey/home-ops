---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
components:
- ../../../components/cnpg-backup
- ../../../components/kopiur
resources:
- ./helmrelease.yaml
- ./postgres-cluster.yaml
patches:
# Back up from a read-only snapshot mount; a full CephFS clone grows ceph-mgr memory
- target:
    kind: SnapshotPolicy
  patch: |-
    - op: add
      path: /spec/staging
      value:
        storageClassName: ceph-filesystem-snapshot
        accessModes: [ReadOnlyMany]
configMapGenerator:
- name: home-assistant-config
  files:
  - recorder.yaml=./config/recorder.yaml
generatorOptions:
  disableNameSuffixHash: true
