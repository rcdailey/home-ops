# yaml-language-server: $schema=https://raw.githubusercontent.com/aclerici38/pocket-id-operator/refs/heads/main/dist/schemas/pocketidoidcclient_v1alpha1.json
---
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: immich
spec:
  name: Immich
  # Generated when the client was created by hand; kept so the operator adopts it
  clientID: 05e88ab9-343d-44b1-b74e-999bc3065779
  skipConsent: true
  launchUrl: https://photos.${SECRET_DOMAIN}
  callbackUrls:
  - https://photos.${SECRET_DOMAIN}/auth/login
  - https://photos.${SECRET_DOMAIN}/user-settings
  - app.immich:///oauth-callback
# Immich reads its OAuth settings only from its admin UI; paste the generated client secret there
# whenever the operator regenerates it
