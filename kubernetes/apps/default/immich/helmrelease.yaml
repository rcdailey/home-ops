---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  maxHistory: 3
  install:
    disableWait: true
    createNamespace: true
    remediation:
      retries: 1
  upgrade:
    disableWait: true
    remediation:
      retries: 1
      strategy: rollback
  uninstall:
    keepHistory: false
  values:
    defaultPodOptions:
      labels:
        observability.home-ops/logs: "true"

    controllers:
      immich:
        replicas: 1
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          enableServiceLinks: false
          nodeSelector:
            feature.node.kubernetes.io/custom-intel-gpu: "true"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
          resourceClaims:
          - name: gpu
            resourceClaimTemplateName: immich
        containers:
          main:
            image:
              repository: ghcr.io/immich-app/immich-server
              tag: v3.4.1@sha256:7c489add298fc2f92cda4c777de6462aa206877e04087b815f62c7664af0b53b
            env:
              IMMICH_TELEMETRY_INCLUDE: all
            envFrom:
            - secretRef:
                name: immich-secret
            - configMapRef:
                name: immich-configmap
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 8Gi
              claims:
              - name: gpu

      machine-learning:
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          enableServiceLinks: false
          nodeSelector:
            feature.node.kubernetes.io/custom-intel-gpu: "true"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
          resourceClaims:
          - name: gpu
            resourceClaimTemplateName: immich
        containers:
          main:
            image:
              repository: ghcr.io/immich-app/immich-machine-learning
              tag: v3.4.1-openvino@sha256:97f60b06c5938c326d3ba416bcf24bc94d233f34554c05f3b76336f98ffd5ea9
            env:
            # v2 models run FP16 on the GPU; the default main revision forces FP32, which
            # crash-looped OpenVINO on the iGPU (immich-app/immich#25830)
            - name: MACHINE_LEARNING_MODEL_REVISION
              value: v2
            # Preload models at startup for faster first search
            - name: MACHINE_LEARNING_PRELOAD__CLIP__TEXTUAL
              value: ViT-SO400M-16-SigLIP2-384__webli
            - name: MACHINE_LEARNING_PRELOAD__CLIP__VISUAL
              value: ViT-SO400M-16-SigLIP2-384__webli
            - name: MACHINE_LEARNING_PRELOAD__FACIAL_RECOGNITION__DETECTION
              value: buffalo_l
            - name: MACHINE_LEARNING_PRELOAD__FACIAL_RECOGNITION__RECOGNITION
              value: buffalo_l
            # Cache configuration matching official chart
            - name: HF_HOME
              value: "/cache"
            - name: TRANSFORMERS_CACHE
              value: "/cache"
            envFrom:
            - secretRef:
                name: immich-secret
            - configMapRef:
                name: immich-configmap
            resources:
              requests:
                cpu: 750m
                memory: 8Gi
              limits:
                memory: 16Gi
              claims:
              - name: gpu
            probes:
              liveness:
                enabled: true
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10

    service:
      immich:
        controller: immich
        labels:
          observability.home-ops/metrics: immich
        ports:
          http:
            port: 2283
          metrics-api:
            port: 8081
          metrics-ms:
            port: 8082
      machine-learning:
        controller: machine-learning
        ports:
          http:
            port: 3003

    route:
      immich:
        hostnames:
        - photos.${SECRET_DOMAIN}
        parentRefs:
        - name: external
          namespace: network
          sectionName: https
        rules:
        - backendRefs:
          - name: immich
            port: 2283

    persistence:
      photos:
        type: nfs
        server: 192.168.1.58
        path: /mnt/user/photos/immich
        advancedMounts:
          immich:
            main:
            - path: /data

      # Thumbnails on Ceph block storage for performance
      thumbnails:
        type: persistentVolumeClaim
        existingClaim: immich-thumbnails
        advancedMounts:
          immich:
            main:
            - path: /data/thumbs
              subPath: thumbs

      # User profile pictures on separate PVC for backup
      profile:
        type: persistentVolumeClaim
        existingClaim: immich-profile
        advancedMounts:
          immich:
            main:
            - path: /data/profile

      ml-cache:
        type: persistentVolumeClaim
        existingClaim: immich-ml-cache
        advancedMounts:
          machine-learning:
            main:
            - path: /cache

      tmpfs:
        type: emptyDir
        advancedMounts:
          immich:
            main:
            - path: /data/.reverse-geocoding-dump
              subPath: geocoding
            - path: /data/.transformers_cache
              subPath: transformers
