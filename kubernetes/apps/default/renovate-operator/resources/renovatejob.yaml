---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/renovate-operator.mogenius.com/renovatejob_v1alpha1.json
apiVersion: renovate-operator.mogenius.com/v1alpha1
kind: RenovateJob
metadata:
  name: renovate
spec:
  provider:
    name: github
  discoveryFilters:
  - rcdailey/home-ops
  schedule: 0 * * * *
  image: ghcr.io/renovatebot/renovate:44.222.5
  parallelism: 1
  metadata:
    labels:
      observability.home-ops/logs: "true"
  extraEnv:
  # Logs in to ghcr.io with the App token; anonymous lookups of large tag lists (immich) hit 429.
  # Upstream marks this experimental for App tokens; if ghcr.io rejects it, use a read:packages PAT.
  - name: RENOVATE_X_GITHUB_HOST_RULES
    value: "true"
  extraVolumes:
  - name: cache
    persistentVolumeClaim:
      claimName: renovate-cache
  extraVolumeMounts:
  - name: cache
    mountPath: /cache
  githubAppReference:
    secretName: renovate-github-app
    appIdSecretKey: CLIENT_ID
    installationIdSecretKey: INSTALL_ID
    pemSecretKey: PEM
  renovateConfig:
    configMapRef:
      name: renovate-global-config
      key: config.json5
  webhook:
    enabled: true
    authentication:
      enabled: true
      secretRef:
        name: renovate-webhook-token
        key: token
    sync:
      enabled: true
