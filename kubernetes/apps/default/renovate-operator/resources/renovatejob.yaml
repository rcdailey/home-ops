---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/renovate-operator.mogenius.com/renovatejob_v1alpha1.json
apiVersion: renovate-operator.mogenius.com/v1alpha1
kind: RenovateJob
metadata:
  name: renovate
spec:
  provider:
    name: github
  discoveryFilters:
  - rcdailey/home-ops
  schedule: 0 * * * *
  image: ghcr.io/renovatebot/renovate:44.222.5
  parallelism: 1
  metadata:
    labels:
      observability.home-ops/logs: "true"
  extraEnv:
  - name: LOG_LEVEL
    value: debug
  # Anonymous ghcr.io lookups of large tag lists (immich) fail, and ghcr.io rejects the App token,
  # so lookups log in with a classic read:packages PAT (ghcr.io accepts no fine-grained tokens)
  - name: RENOVATE_DETECT_HOST_RULES_FROM_ENV
    value: "true"
  - name: RENOVATE_DOCKER_GHCR_IO_USERNAME
    value: rcdailey
  - name: RENOVATE_DOCKER_GHCR_IO_PASSWORD
    valueFrom:
      secretKeyRef:
        name: renovate-ghcr-token
        key: token
  extraVolumes:
  - name: cache
    persistentVolumeClaim:
      claimName: renovate-cache
  extraVolumeMounts:
  - name: cache
    mountPath: /cache
  githubAppReference:
    secretName: renovate-github-app
    appIdSecretKey: CLIENT_ID
    installationIdSecretKey: INSTALL_ID
    pemSecretKey: PEM
  renovateConfig:
    configMapRef:
      name: renovate-global-config
      key: config.json5
  webhook:
    enabled: true
    authentication:
      enabled: true
      secretRef:
        name: renovate-webhook-token
        key: token
    sync:
      enabled: true
