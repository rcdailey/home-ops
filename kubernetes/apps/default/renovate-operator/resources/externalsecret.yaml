# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: renovate-github-app
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: renovate-github-app
    creationPolicy: Owner
    template:
      metadata:
        labels:
          # The operator reads only Secrets that opt in to caller-chosen key references
          renovate-operator.mogenius.com/allow-ref: "true"
      data:
        # Public identifiers; GitHub accepts the client ID in place of the numeric App ID
        CLIENT_ID: Iv23liL8Uy7BfGLZZAPU
        INSTALL_ID: "179999820"
        PEM: "{{ .PEM }}"
  data:
  - secretKey: PEM
    remoteRef:
      key: /default/renovate-operator/github-app-private-key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: renovate-webhook-token
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: renovate-webhook-token
    creationPolicy: Owner
    template:
      metadata:
        labels:
          renovate-operator.mogenius.com/allow-ref: "true"
  data:
  - secretKey: token
    remoteRef:
      key: /default/renovate-operator/webhook-secret
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: renovate-ghcr-token
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: renovate-ghcr-token
    creationPolicy: Owner
    template:
      metadata:
        labels:
          renovate-operator.mogenius.com/allow-ref: "true"
  data:
  - secretKey: token
    remoteRef:
      key: /default/renovate-operator/ghcr-token
