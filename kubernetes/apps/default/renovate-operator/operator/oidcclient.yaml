# yaml-language-server: $schema=https://raw.githubusercontent.com/aclerici38/pocket-id-operator/refs/heads/main/dist/schemas/pocketidoidcclient_v1alpha1.json
---
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: renovate-operator
spec:
  name: Renovate
  clientID: renovate-operator
  skipConsent: true
  launchUrl: https://renovate.${SECRET_DOMAIN}
  callbackUrls:
  - https://renovate.${SECRET_DOMAIN}/auth/callback
  logoutCallbackUrls:
  - https://renovate.${SECRET_DOMAIN}
  allowedUserGroups:
  - name: admins
  secret:
    keys:
      clientSecret: client-secret
