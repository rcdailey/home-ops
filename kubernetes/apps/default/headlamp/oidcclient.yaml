# yaml-language-server: $schema=https://raw.githubusercontent.com/aclerici38/pocket-id-operator/refs/heads/main/dist/schemas/pocketidoidcclient_v1alpha1.json
---
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: headlamp
spec:
  name: Headlamp
  clientID: headlamp
  skipConsent: true
  launchUrl: https://cluster.${SECRET_DOMAIN}
  callbackUrls:
  - https://cluster.${SECRET_DOMAIN}/oidc-callback
  secret:
    # The chart loads this Secret whole as environment variables
    keys:
      clientID: OIDC_CLIENT_ID
      clientSecret: OIDC_CLIENT_SECRET
      issuerUrl: OIDC_ISSUER_URL
