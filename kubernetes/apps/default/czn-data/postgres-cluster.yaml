---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: czn-data-postgres
spec:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:18
  # No backups: every row is rebuilt from prydwen.gg by the next scrape.
  bootstrap:
    initdb:
      database: czn
      owner: czn
  storage:
    size: 2Gi
    storageClass: ceph-block
  resources:
    requests:
      memory: 128Mi
      cpu: 50m
    limits:
      memory: 512Mi
