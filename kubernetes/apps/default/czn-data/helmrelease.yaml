---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app czn-data
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    defaultPodOptions:
      labels:
        observability.home-ops/logs: "true"
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}

    controllers:
      czn-data:
        annotations:
          reloader.stakater.com/auto: "true"
          # Keel restarts the server when the latest tag points to a new digest.
          keel.sh/policy: force
          keel.sh/matchTag: "true"
          keel.sh/trigger: poll
        containers:
          app:
            image: &image
              repository: ghcr.io/rcdailey/czn-data
              tag: latest
              pullPolicy: Always
            args: ["serve"]
            env:
              DATABASE_URL: &databaseUrl
                valueFrom:
                  secretKeyRef:
                    name: czn-data-postgres-app
                    key: uri
              MCP_PUBLIC_URL: https://czn.${SECRET_DOMAIN}/mcp
              OIDC_ISSUER: https://auth.${SECRET_DOMAIN}
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: &port 8000
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                # The search embedding model brings one process to about 340 MB.
                memory: 768Mi
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
        # Upgrades the schema before the server queries it; a migration that changes parsed
        # tables also rebuilds them from the stored HTML.
        initContainers:
          migrate:
            image: *image
            args: ["migrate"]
            env:
              DATABASE_URL: *databaseUrl
            resources: &jobResources
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 1Gi
            securityContext: *securityContext
          # Starts a scrape the first time a new image runs, so its parsers rebuild the data;
          # restarts on the same image skip. A running scrape is cancelled first because
          # czn-data skips a run that starts while another holds its lock. Failures only log,
          # so the server still starts and the daily CronJob still runs.
          trigger-scrape:
            dependsOn: migrate
            image:
              repository: docker.io/alpine/k8s
              tag: 1.37.2
            command: ["sh", "-c"]
            args:
            - |
              fail() { echo "scrape trigger failed: $1"; exit 0; }
              key=czn-data.home-ops/scraped-image
              image=$(kubectl get pod "$POD_NAME" -o jsonpath='{.status.initContainerStatuses[?(@.name=="migrate")].imageID}') \
                || fail "read pod image"
              [ -n "$image" ] || fail "pod image is empty"
              scraped=$(kubectl get cronjob czn-data-daily \
                -o jsonpath='{.metadata.annotations.czn-data\.home-ops/scraped-image}') \
                || fail "read CronJob"
              if [ "$image" = "$scraped" ]; then echo "already scraped $image"; exit 0; fi
              running=$(kubectl get jobs -l app.kubernetes.io/instance=czn-data,app.kubernetes.io/controller=daily \
                -o jsonpath='{range .items[?(@.status.active)]}{.metadata.name}{" "}{end}') \
                || fail "list jobs"
              if [ -n "$running" ]; then
                # Foreground deletion returns once the pods are gone and their lock is released.
                kubectl delete job $running --cascade=foreground --timeout=2m || fail "cancel $running"
              fi
              kubectl create job --from=cronjob/czn-data-daily "czn-data-daily-image-$(date +%s)" \
                || fail "create job"
              kubectl annotate cronjob czn-data-daily --overwrite "$key=$image" || fail "record image"
            env:
              HOME: /tmp
              POD_NAME:
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.name
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
            securityContext: *securityContext

      # Scrapes Prydwen, e7bot, and Stove at once (about 20 minutes, Prydwen's pace), then tags
      # portraits, then builds the merged tables once.
      daily:
        type: cronjob
        cronjob:
          schedule: "0 4 * * *"
          timeZone: America/Chicago
          backoffLimit: 0
          concurrencyPolicy: Forbid
          successfulJobsHistory: 1
          failedJobsHistory: 1
          ttlSecondsAfterFinished: 86400
        pod:
          restartPolicy: Never
        containers:
          app:
            image: *image
            args: ["daily"]
            env:
              DATABASE_URL: *databaseUrl
              OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-gateway-collector.observability:4318
              OTEL_SERVICE_NAME: czn-data
              CZN_TAGGER_DIR: /models
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                # Loading the tagger model takes about 1 GB.
                memory: 2Gi
            securityContext: *securityContext

    # Only the trigger-scrape init container mounts a token for this account.
    rbac:
      roles:
        trigger-scrape:
          type: Role
          rules:
          - apiGroups: [""]
            resources: ["pods"]
            verbs: ["get"]
          - apiGroups: ["batch"]
            resources: ["cronjobs"]
            resourceNames: ["czn-data-daily"]
            verbs: ["get", "patch"]
          - apiGroups: ["batch"]
            resources: ["jobs"]
            verbs: ["get", "list", "watch", "create", "delete"]
      bindings:
        trigger-scrape:
          type: RoleBinding
          roleRef:
            identifier: trigger-scrape
          subjects:
          - identifier: czn-data

    serviceAccount:
      czn-data: {}

    service:
      app:
        controller: *app
        ports:
          http:
            port: *port

    route:
      app:
        hostnames:
        - czn.${SECRET_DOMAIN}
        parentRefs:
        - name: external
          namespace: network
          sectionName: https
        rules:
        - backendRefs:
          - name: *app
            port: *port

    persistence:
      tagger:
        existingClaim: czn-data-tagger
        advancedMounts:
          daily:
            app:
            - path: /models
      kube-api-access:
        type: custom
        volumeSpec:
          projected:
            sources:
            - serviceAccountToken:
                path: token
            - configMap:
                name: kube-root-ca.crt
                items:
                - key: ca.crt
                  path: ca.crt
            - downwardAPI:
                items:
                - path: namespace
                  fieldRef:
                    fieldPath: metadata.namespace
        advancedMounts:
          czn-data:
            trigger-scrape:
            - path: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
      tmp:
        type: emptyDir
        globalMounts:
        - path: /tmp
