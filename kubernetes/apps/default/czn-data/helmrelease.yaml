---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app czn-data
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    defaultPodOptions:
      labels:
        observability.home-ops/logs: "true"
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}

    controllers:
      czn-data:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image: &image
              repository: ghcr.io/rcdailey/czn-data
              tag: latest@sha256:c2bc6d7f254f07541df4a218698f7093730060469c91cb2bf839fa63a4cf2375
            args: ["serve"]
            env:
              DATABASE_URL: &databaseUrl
                valueFrom:
                  secretKeyRef:
                    name: czn-data-postgres-app
                    key: uri
              MCP_PUBLIC_URL: https://czn.${SECRET_DOMAIN}/mcp
              OIDC_ISSUER: https://auth.${SECRET_DOMAIN}
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: &port 8000
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Mi
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
        # Upgrades the schema before the server queries it; a migration that changes parsed
        # tables also rebuilds them from the stored HTML.
        initContainers:
          migrate:
            image: *image
            args: ["migrate"]
            env:
              DATABASE_URL: *databaseUrl
            resources: &jobResources
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 1Gi
            securityContext: *securityContext

      scrape:
        type: cronjob
        cronjob:
          schedule: "0 4 * * *"
          timeZone: America/Chicago
          backoffLimit: 0
          concurrencyPolicy: Forbid
          successfulJobsHistory: 1
          failedJobsHistory: 1
          ttlSecondsAfterFinished: 86400
        pod:
          restartPolicy: Never
        containers:
          app:
            image: *image
            args: ["scrape"]
            env:
              DATABASE_URL: *databaseUrl
              OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-gateway-collector.observability:4318
              OTEL_SERVICE_NAME: czn-data
            resources: *jobResources
            securityContext: *securityContext

    service:
      app:
        controller: *app
        ports:
          http:
            port: *port

    route:
      app:
        hostnames:
        - czn.${SECRET_DOMAIN}
        parentRefs:
        - name: external
          namespace: network
          sectionName: https
        rules:
        - backendRefs:
          - name: *app
            port: *port

    persistence:
      tmp:
        type: emptyDir
        globalMounts:
        - path: /tmp
