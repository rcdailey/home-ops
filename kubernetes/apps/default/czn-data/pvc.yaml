# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/v1/persistentvolumeclaim.json
---
# The enrich job's portrait tagger model (467 MB). It downloads again when missing, so it has no
# backup.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: czn-data-tagger
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: ceph-block
  resources:
    requests:
      storage: 2Gi
