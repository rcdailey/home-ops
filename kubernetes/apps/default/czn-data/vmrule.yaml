---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/operator.victoriametrics.com/vmrule_v1beta1.json
# Copied from rcdailey/chaos-zero-nightmare projects/czn-data/deploy/alerts.yaml; keep in sync.
# Each job run writes new series, so the run-state rules read only the newest run's series;
# that lets an alert resolve after the next good run. The 26h windows assume the daily CronJobs.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: czn-data
  labels:
    observability.home-ops/datasource: metrics
spec:
  groups:
  - name: czn-data
    rules:
    - alert: CznScrapeStale
      expr: >-
        time() - max(last_over_time(czn_scrape_last_success_timestamp_seconds[7d])) > 36 * 3600
        or (
          absent_over_time(czn_scrape_last_success_timestamp_seconds[7d])
          and on () count(last_over_time(czn_scrape_last_run_timestamp_seconds[7d]))
        )
      labels:
        severity: warning
      annotations:
        summary: No fully successful czn-data scrape in 36 hours
        description: Check the CronJob and the other czn-data alerts for the cause.

    - alert: CznScrapeBlocked
      expr: >-
        max(
          last_over_time(czn_scrape_blocked[26h])
          and tlast_over_time(czn_scrape_blocked[26h])
            == scalar(max(tlast_over_time(czn_scrape_blocked[26h])))
        ) == 1
      labels:
        severity: warning
      annotations:
        summary: Cloudflare blocked the czn-data scraper
        description: >-
          Cloudflare now challenges the scraper's Chrome impersonation. Update curl_cffi or its
          impersonation target. The database keeps the previous data.

    - alert: CznScrapeDiscoveryFailed
      expr: >-
        max(
          last_over_time(czn_scrape_discovery_failed[26h])
          and tlast_over_time(czn_scrape_discovery_failed[26h])
            == scalar(max(tlast_over_time(czn_scrape_discovery_failed[26h])))
        ) == 1
      labels:
        severity: warning
      annotations:
        summary: czn-data could not list Prydwen pages from robots.txt and the sitemaps

    - alert: CznScrapeLayoutChanged
      expr: >-
        max(
          last_over_time(czn_scrape_pages{result="parse_error"}[26h])
          and tlast_over_time(czn_scrape_pages{result="parse_error"}[26h])
            == scalar(max(tlast_over_time(czn_scrape_pages{result="parse_error"}[26h])))
        ) > 0
      labels:
        severity: warning
      annotations:
        summary: "Prydwen layout changed: {{ $value }} pages no longer parse"
        description: >-
          The previous data is still served. Failed fields are in the
          czn_scrape_validation_failures series (labels kind, field), in VictoriaLogs
          (`"parse failed"`), and in the MCP data_status tool. Fix the parser, then run
          `czn-data reparse`. A `.count` field means a page lost many rows; if Prydwen really
          removed them, run `czn-data reparse --allow-shrink`.

    - alert: CznScrapeFetchErrors
      expr: >-
        max(
          last_over_time(czn_scrape_pages{result="fetch_error"}[26h])
          and tlast_over_time(czn_scrape_pages{result="fetch_error"}[26h])
            == scalar(max(tlast_over_time(czn_scrape_pages{result="fetch_error"}[26h])))
        ) > 0
      labels:
        severity: warning
      annotations:
        summary: >-
          {{ $value }} Prydwen pages or card images failed to download in the last czn-data
          run
        description: URLs and errors are in VictoriaLogs (`"fetch failed"`).

    - alert: CznE7botStale
      expr: >-
        time() - max(last_over_time(czn_e7bot_last_success_timestamp_seconds[7d])) > 36 * 3600
        or (
          absent_over_time(czn_e7bot_last_success_timestamp_seconds[7d])
          and on () count(last_over_time(czn_e7bot_last_run_timestamp_seconds[7d]))
        )
      labels:
        severity: warning
      annotations:
        summary: No fully successful czn-data e7bot scrape in 36 hours
        description: >-
          The MCP keeps serving the last good e7bot data. Check the scrape-e7bot CronJob and
          CznE7botFailed for the cause.

    - alert: CznE7botFailed
      expr: >-
        max(
          last_over_time(czn_e7bot_success[26h])
          and tlast_over_time(czn_e7bot_success[26h])
            == scalar(max(tlast_over_time(czn_e7bot_success[26h])))
        ) == 0
      labels:
        severity: warning
      annotations:
        summary: The last czn-data e7bot scrape failed
        description: >-
          The previous e7bot data is still served. Failed fields are in the
          czn_e7bot_validation_failures series (label field), in VictoriaLogs
          (`"e7bot run failed"`), and in the MCP data_status tool. A `decrypt` field means
          e7bot changed its key (see the site's JavaScript); a `.count` field means a list lost
          many items, which `czn-data scrape-e7bot --allow-shrink` accepts.

    - alert: CznStoveStale
      expr: >-
        time() - max(last_over_time(czn_stove_last_success_timestamp_seconds[7d])) > 36 * 3600
        or (
          absent_over_time(czn_stove_last_success_timestamp_seconds[7d])
          and on () count(last_over_time(czn_stove_last_run_timestamp_seconds[7d]))
        )
      labels:
        severity: warning
      annotations:
        summary: No fully successful czn-data Stove scrape in 36 hours
        description: >-
          The MCP keeps serving the stored Stove posts. Check the scrape-stove CronJob and
          CznStoveFailed for the cause.

    - alert: CznStoveFailed
      expr: >-
        max(
          last_over_time(czn_stove_success[26h])
          and tlast_over_time(czn_stove_success[26h])
            == scalar(max(tlast_over_time(czn_stove_success[26h])))
        ) == 0
      labels:
        severity: warning
      annotations:
        summary: The last czn-data Stove scrape failed
        description: >-
          Stored posts are kept. Failed fields are in the czn_stove_validation_failures series
          (label field), in VictoriaLogs (`"board failed"`, `"post fetch failed"`,
          `"post invalid"`), and in the MCP data_status tool. A `list.count` field means a
          board lost many posts, which `czn-data scrape-stove --allow-shrink` accepts.

    - alert: CznBuildFailed
      expr: >-
        max(
          last_over_time(czn_build_success[26h])
          and tlast_over_time(czn_build_success[26h])
            == scalar(max(tlast_over_time(czn_build_success[26h])))
        ) == 0
      labels:
        severity: warning
      annotations:
        summary: The last czn-data build failed; the MCP serves the previous merged data
        description: The cause is in VictoriaLogs (`"build failed"`).

    - alert: CznBuildUnmatched
      expr: >-
        max(
          last_over_time(czn_build_unmatched{entity="card"}[26h])
          and tlast_over_time(czn_build_unmatched{entity="card"}[26h])
            == scalar(max(tlast_over_time(czn_build_unmatched{entity="card"}[26h])))
        ) > 0
      labels:
        severity: warning
      annotations:
        summary: "{{ $value }} Prydwen card rows matched no e7bot card"
        description: >-
          Those cards are served from Prydwen alone, so their ratings sit beside, not on, the
          game's card. VictoriaLogs (`"Prydwen rows matched no e7bot record"`) has the counts;
          fix the name or version matching in czn_data.build.

    - alert: CznEnrichStale
      expr: >-
        time() - max(last_over_time(czn_enrich_last_success_timestamp_seconds[7d])) > 36 * 3600
        or (
          absent_over_time(czn_enrich_last_success_timestamp_seconds[7d])
          and on () count(last_over_time(czn_enrich_last_run_timestamp_seconds[7d]))
        )
      labels:
        severity: warning
      annotations:
        summary: No fully successful czn-data enrich run in 36 hours
        description: Check the enrich CronJob and CznEnrichFailed for the cause.

    - alert: CznEnrichFailed
      expr: >-
        max by (step) (
          last_over_time(czn_enrich_failures[26h])
          and tlast_over_time(czn_enrich_failures[26h])
            == scalar(max(tlast_over_time(czn_enrich_failures[26h])))
        ) > 0
      labels:
        severity: warning
      annotations:
        summary: "czn-data enrich: {{ $value }} rows failed in step {{ $labels.step }}"
        description: >-
          Errors are in VictoriaLogs (`"portrait tagger unavailable"`, `"portrait tagging
          failed"`). Failed rows are tried again on the next run.
