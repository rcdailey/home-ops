# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app docs-mcp-server
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      docs-mcp-server:
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/arabold/docs-mcp-server
              tag: 2.4.5
            env:
              TZ: America/Chicago
              DOCS_MCP_CONFIG: /config/config.yaml
              OPENAI_API_BASE: https://api.fireworks.ai/inference/v1
            envFrom:
            - secretRef:
                name: docs-mcp-server-secret

            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &port 6280

            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 2Gi

            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                - ALL

        pod:
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch

    service:
      app:
        controller: *app
        ports:
          http:
            port: *port

    route:
      app:
        hostnames:
        - aidocs.${SECRET_DOMAIN}
        parentRefs:
        - name: internal
          namespace: network
          sectionName: https

    persistence:
      data:
        existingClaim: *app
        advancedMounts:
          docs-mcp-server:
            app:
            - path: /data

      config:
        type: configMap
        name: docs-mcp-server-config
        advancedMounts:
          docs-mcp-server:
            app:
            - path: /config
              readOnly: true

      tmp:
        type: emptyDir
        advancedMounts:
          docs-mcp-server:
            app:
            - path: /tmp

      shm:
        type: emptyDir
        medium: Memory
        advancedMounts:
          docs-mcp-server:
            app:
            - path: /dev/shm
