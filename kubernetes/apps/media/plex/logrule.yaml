---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/operator.victoriametrics.com/vmrule_v1beta1.json
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: plex-logs
  labels:
    observability.home-ops/datasource: logs
spec:
  groups:
  - name: plex
    type: vlogs
    interval: 1m
    rules:
    - alert: PlexDatabaseIsBusy
      expr: |-
        _time:5m "service.name":="plex" _msg:~"(?i)retry busy DB"
          | stats count() as hits
          | filter hits:>0
      for: 5m
      annotations:
        summary: Plex is experiencing database issues
      labels:
        severity: critical

    - alert: PlexTranscodingErrors
      expr: |-
        _time:10m "service.name":="plex" _msg:~"(?i)transcode.*error"
          | stats count() as hits
          | filter hits:>5
      for: 5m
      annotations:
        summary: Plex is experiencing frequent transcoding errors
      labels:
        severity: warning

    - alert: PlexHighMemoryUsage
      expr: |-
        _time:5m "service.name":="plex" _msg:~"(?i)out of memory|memory.*full"
          | stats count() as hits
          | filter hits:>0
      for: 2m
      annotations:
        summary: Plex is running out of memory
      labels:
        severity: warning

    - alert: PlexAuthenticationFailures
      expr: |-
        _time:15m "service.name":="plex" _msg:~"(?i)authentication.*failed|invalid.*token"
          | stats count() as hits
          | filter hits:>10
      for: 5m
      annotations:
        summary: Plex is experiencing authentication failures
      labels:
        severity: warning
