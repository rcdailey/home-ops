# yaml-language-server: $schema=https://raw.githubusercontent.com/aclerici38/pocket-id-operator/refs/heads/main/dist/schemas/pocketidoidcclient_v1alpha1.json
---
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: crosswatch
spec:
  name: CrossWatch
  clientID: crosswatch
  skipConsent: true
  launchUrl: https://crosswatch.${SECRET_DOMAIN}
  callbackUrls:
  - https://crosswatch.${SECRET_DOMAIN}/api/app-auth/oidc/callback
  allowedUserGroups:
  - name: admins
    namespace: default
