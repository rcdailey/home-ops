---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: recyclarr
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: recyclarr
  values:
    deploymentAnnotations:
      reloader.stakater.com/auto: "true"
    apiKey:
      existingSecret: recyclarr-secret
      existingSecretKey: RECYCLARR_API_KEY
    configs:
      existingConfigMap: recyclarr-configmap
    settings:
      existingConfigMap: recyclarr-settings
    env:
    - name: TZ
      value: America/Chicago
    envFrom:
    - secretRef:
        name: recyclarr-secret
    persistence:
      # Kopiur-backed volume from v8; the server moves its nested state/ folder to the root on
      # first start and leaves the other v8 files in place.
      state:
        existingClaim: recyclarr
      data:
        enabled: true
        existingClaim: recyclarr-data
    serviceMonitor:
      enabled: true
    podLabels:
      observability.home-ops/log-format: json
      observability.home-ops/logs: "true"
    resources:
      requests:
        cpu: 10m
        memory: 256Mi
      limits:
        memory: 512Mi
