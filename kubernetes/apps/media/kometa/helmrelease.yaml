---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kometa
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      kometa:
        type: cronjob
        annotations:
          reloader.stakater.com/auto: "true"

        cronjob:
          # Run 4x daily - reduced frequency to prevent overlap
          # Schedule: 01:00, 09:00, 15:00, 21:00 (6 hour intervals)
          schedule: "0 1,9,15,21 * * *"
          timeZone: America/Chicago
          # CRITICAL: Forbid prevents overlapping jobs - CronJob will skip new runs if previous
          # still active
          concurrencyPolicy: Forbid
          # Keep only 1 job in history to prevent Flux from triggering duplicate jobs during
          # reconciliation
          successfulJobsHistory: 1
          failedJobsHistory: 1
          # Timeout jobs after 5 hours to prevent blocking next run
          activeDeadlineSeconds: 18000
          # Limit retries to prevent infinite loops
          backoffLimit: 0
          # Cleanup completed jobs after 6 hours (matches schedule interval)
          ttlSecondsAfterFinished: 21600

        initContainers:
          collector:
            image:
              repository: otel/opentelemetry-collector-k8s
              tag: 0.160.0@sha256:76d7a04f2291da1d8b7ce259468d09f0f9f44f71f67a5737539f64ca82b5bdb1
            args: [--config=/etc/otelcol/config.yaml]
            env:
              K8S_NAMESPACE:
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.namespace
              K8S_NODE_NAME:
                valueFrom:
                  fieldRef:
                    fieldPath: spec.nodeName
              K8S_POD_NAME:
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.name
              K8S_POD_UID:
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.uid
              K8S_JOB_NAME:
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.labels['batch.kubernetes.io/job-name']
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 13133
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 256Mi
            restartPolicy: Always
            securityContext:
              runAsUser: 1000
              runAsGroup: 1000
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]

        containers:
          app:
            image:
              repository: kometateam/kometa
              tag: v2.4.8@sha256:c58f6d4af511613f218b6dafbfc84078af4e5a6089790c1fdba58fd7c5dad70a
            command:
            - /bin/sh
            - -c
            args:
            - |
              python3 kometa.py --run --read-only-config --run-libraries "Anime Series" \
                >> /config/logs/console.log 2>&1;
              python3 kometa.py --run --read-only-config --run-libraries "Movies" \
                >> /config/logs/console.log 2>&1;
              python3 kometa.py --run --read-only-config --run-libraries "TV Shows" \
                >> /config/logs/console.log 2>&1;
              status=$?;
              # Allow the file tailer to ingest final records before Kubernetes stops it.
              sleep 2;
              exit "$status";
            env:
              TZ: America/Chicago
              # Reduce log verbosity: hide progress bars and minimize box width
              KOMETA_IGNORE_GHOST: "true"
              KOMETA_WIDTH: "90"
            envFrom:
            - secretRef:
                name: kometa-secret
            resources:
              requests:
                cpu: 10m
                memory: 4Gi
              limits:
                memory: 8Gi
            securityContext:
              runAsUser: 1000
              runAsGroup: 1000
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]

    defaultPodOptions:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch

    persistence:
      config:
        type: persistentVolumeClaim
        existingClaim: kometa
        advancedMounts:
          kometa:
            app:
            - path: /config
            collector:
            - path: /config

      config-file:
        type: configMap
        name: kometa-configmap
        advancedMounts:
          kometa:
            app:
            - path: /config/config.yml
              subPath: config.yml
              readOnly: true

      collector-config:
        type: configMap
        name: kometa-otel-config
        advancedMounts:
          kometa:
            collector:
            - path: /etc/otelcol/config.yaml
              subPath: collector.yaml
              readOnly: true

      metadata-files:
        type: configMap
        name: kometa-configmap
        advancedMounts:
          kometa:
            app:
            - path: /config/metadata
              readOnly: true

      logs:
        type: emptyDir
        advancedMounts:
          kometa:
            app:
            - path: /config/logs
              subPath: logs
            collector:
            - path: /config/logs
              subPath: logs
