---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: silo-secret
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: silo-secret
    creationPolicy: Owner
  data:
  # Encrypts stored credentials; Silo cannot open its database without this exact value.
  - secretKey: SECRET_KEY
    remoteRef:
      key: /media/silo/secret-key
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: silo-admin-api
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: silo-admin-api
    creationPolicy: Owner
  data:
  # An API key owned by the Silo owner account, created in the web app after onboarding.
  - secretKey: SILO_API_KEY
    remoteRef:
      key: /media/silo/admin-api-key
