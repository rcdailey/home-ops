---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/gateway.envoyproxy.io/clienttrafficpolicy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: envoy
  namespace: network
spec:
  targetSelectors:
  - group: gateway.networking.k8s.io
    kind: Gateway
  headers:
    earlyRequestHeaders:
      remove:
      - baggage
      - b3
      - grpc-trace-bin
      - ot-tracer-sampled
      - ot-tracer-spanid
      - ot-tracer-traceid
      - traceparent
      - tracestate
      - uber-trace-id
      - x-amzn-trace-id
      - x-b3-flags
      - x-b3-parentspanid
      - x-b3-sampled
      - x-b3-spanid
      - x-b3-traceid
      - x-cloud-trace-context
      - x-ot-span-context
  clientIPDetection:
    xForwardedFor:
      # Trust pod CIDR for X-Forwarded-For evaluation (prevents external IP spoofing)
      trustedCIDRs:
      - 10.42.0.0/16
  tls:
    minVersion: "1.2"
    alpnProtocols:
    - h2
    - http/1.1
  # Extend stream idle timeout for SSE/streaming connections (MCP servers)
  # Default 5m kills long-lived SSE streams during idle periods
  timeout:
    http:
      streamIdleTimeout: 86400s
  tcpKeepalive: {}
