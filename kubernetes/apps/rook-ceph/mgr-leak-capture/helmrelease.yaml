---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
# Temporary: memory capture for https://tracker.ceph.com/issues/82544. Remove when the issue no
# longer needs data.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mgr-leak-capture
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  interval: 30m
  maxHistory: 3
  uninstall:
    keepHistory: false
  values:
    controllers:
      mgr-leak-capture:
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          automountServiceAccountToken: false
          # Reading another process's /proc/<pid>/smaps needs the host PID namespace, root and
          # CAP_SYS_PTRACE. Pinned to the node running the active mgr (mgr.a).
          hostPID: true
          nodeSelector:
            kubernetes.io/hostname: hanekawa
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false
            seccompProfile: {type: RuntimeDefault}
        containers:
          app:
            image:
              repository: quay.io/ceph/ceph
              tag: v20.2.5
            command: [/bin/bash, /scripts/capture.sh]
            env:
              MODE: csi
              # Before the ~07:25 UTC Kopiur backup, so the new ceph-csi clone is detected
              TRIGGER_AT: "07:10"
              MGR_ID: a
              FS: ceph-filesystem
              SOURCE_GROUP: csi
              SOURCE_SUBVOLUME: csi-vol-e20b9053-e458-45ac-acb6-f9ed7ce05512
              CEPH_USERNAME:
                valueFrom:
                  secretKeyRef:
                    name: rook-ceph-mon
                    key: ceph-username
            securityContext:
              readOnlyRootFilesystem: true
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
                add: ["SYS_PTRACE"]
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi

    persistence:
      data:
        existingClaim: mgr-leak-capture
        advancedMounts:
          mgr-leak-capture:
            app:
            - path: /data
      scripts:
        type: configMap
        name: mgr-leak-capture-scripts
        advancedMounts:
          mgr-leak-capture:
            app:
            - path: /scripts
              readOnly: true
      ceph-secret:
        type: secret
        name: rook-ceph-mon
        advancedMounts:
          mgr-leak-capture:
            app:
            - path: /etc/rook-secret
              readOnly: true
      mon-endpoints:
        type: configMap
        name: rook-ceph-mon-endpoints
        advancedMounts:
          mgr-leak-capture:
            app:
            - path: /etc/rook-mon
              readOnly: true
      tmp:
        type: emptyDir
        advancedMounts:
          mgr-leak-capture:
            app:
            - path: /tmp
