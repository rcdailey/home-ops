---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/node.k8s.io/runtimeclass_v1.json
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: psa-exempt
  annotations:
    kubernetes.io/description: >-
      Selects the standard runtime for Pod Security-exempt workloads. Talos exempts this
      RuntimeClass from Pod Security Admission; the psa-exempt-runtime policy owns the allowlist.
handler: runc
