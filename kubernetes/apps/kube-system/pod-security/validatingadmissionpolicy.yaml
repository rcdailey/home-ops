---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/admissionregistration.k8s.io/validatingadmissionpolicy_v1.json
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: psa-exempt-runtime
  annotations:
    kubernetes.io/description: >-
      Restricts the Pod Security-exempt runtime to explicitly allowed workloads.
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups: [""]
      apiVersions: [v1]
      operations: [CREATE, UPDATE]
      resources: [pods]
  matchConditions:
  - name: uses-psa-exempt-runtime
    expression: object.spec.?runtimeClassName.orValue("") == "psa-exempt"
  variables:
  - name: workload
    expression: object.metadata.?labels["home-ops.io/workload"].orValue("")
  validations:
  # Add a workload by extending this allowlist; Talos does not need to change.
  - expression: >-
      (object.metadata.namespace == "media" && variables.workload == "torrent-vpn") ||
      (object.metadata.namespace == "observability" && variables.workload == "otel-node")
    message: The psa-exempt RuntimeClass is reserved for allowlisted workloads
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/admissionregistration.k8s.io/validatingadmissionpolicybinding_v1.json
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: psa-exempt-runtime
spec:
  policyName: psa-exempt-runtime
  validationActions: [Deny]
