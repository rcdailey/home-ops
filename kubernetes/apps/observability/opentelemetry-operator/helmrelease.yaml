---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: opentelemetry-operator
spec:
  interval: 1h
  chart:
    spec:
      chart: opentelemetry-operator
      version: 0.124.1
      sourceRef:
        kind: HelmRepository
        name: opentelemetry-operator
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    fullnameOverride: otel-operator
    manager:
      collectorImage:
        repository: otel/opentelemetry-collector-k8s
        tag: 0.161.0
      resources:
        limits:
          memory: 256Mi
        requests:
          cpu: 20m
          memory: 128Mi
      serviceMonitor:
        enabled: true
      serviceAccount:
        name: otel-operator
