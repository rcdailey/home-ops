---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-node
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: otel-node
rules:
- apiGroups: [""]
  resources:
  - namespaces
  - nodes
  - persistentvolumeclaims
  - persistentvolumes
  - pods
  verbs: [get, list, watch]
- apiGroups: [""]
  resources: [nodes/pods, nodes/proxy, nodes/stats]
  verbs: [get]
- apiGroups: [apps]
  resources: [deployments, replicasets]
  verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: otel-node
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: otel-node
subjects:
- kind: ServiceAccount
  name: otel-node
  namespace: observability
