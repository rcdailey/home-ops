---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/operator.victoriametrics.com/vmrule_v1beta1.json
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: log-volume-alerts
  labels:
    observability.home-ops/datasource: logs
spec:
  groups:
  - name: log-volume
    type: vlogs
    interval: 1m
    rules:
    - alert: ContainerLogVolumeHigh
      expr: |-
        _time:5m k8s.pod.name:*
          | stats by (k8s.namespace.name, k8s.pod.name, k8s.container.name)
              count() as log_rows
          | filter log_rows:>50000
      annotations:
        summary: Container {{ index .Labels "k8s.pod.name" }} has extreme log volume
        description: >-
          Container {{ index .Labels "k8s.namespace.name" }}/{{ index .Labels "k8s.pod.name" }}/
          {{ index .Labels "k8s.container.name" }} produced {{ $value }} log entries in 5 minutes.
      labels:
        severity: warning
