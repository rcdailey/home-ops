---
# yaml-language-server: $schema=https://raw.githubusercontent.com/victoriametrics/operator/master/config/crd/bases/operator.victoriametrics.com_vmrules.yaml
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: kubernetes-alerts
spec:
  groups:
  - name: kubernetes-pods
    interval: 30s
    rules:
    - alert: PodCrashLooping
      expr: changes(otel_k8s_container_restarts[10m]) >= 3
      labels:
        severity: warning
      annotations:
        summary: >-
          Pod {{ $labels.k8s_namespace_name }}/{{ $labels.k8s_pod_name }} is restarting
        description: >-
          Container {{ $labels.k8s_container_name }} restarted during the last 5 minutes

    - alert: PodNotReady
      expr: |
        otel_k8s_pod_phase == 1 or otel_k8s_pod_phase >= 5
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: >-
          Pod {{ $labels.k8s_namespace_name }}/{{ $labels.k8s_pod_name }} is not running
        description: The pod has remained Pending or Unknown for 15 minutes

    - alert: ContainerNotReady
      expr: |
        otel_k8s_container_ready == 0
          and on (k8s_namespace_name, k8s_pod_name)
        otel_k8s_pod_phase == 2
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: >-
          Container {{ $labels.k8s_namespace_name }}/{{ $labels.k8s_pod_name }}/
          {{ $labels.k8s_container_name }} is not ready

    - alert: DeploymentReplicasMismatch
      expr: |
        otel_k8s_deployment_desired != otel_k8s_deployment_available
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: >-
          Deployment {{ $labels.k8s_namespace_name }}/{{ $labels.k8s_deployment_name }}
          has unavailable replicas
        description: Desired and available replica counts have differed for 15 minutes

  - name: kubernetes-resources
    interval: 30s
    rules:
    - alert: ContainerHighCPU
      expr: otel_k8s_container_cpu_limit_ratio > 0.8
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: "High CPU usage in {{ $labels.k8s_container_name }}"
        description: >-
          Container {{ $labels.k8s_namespace_name }}/{{ $labels.k8s_pod_name }}/
          {{ $labels.k8s_container_name }} is using {{ $value | humanizePercentage }} of its limit

    - alert: ContainerHighMemory
      expr: |
        container_memory_working_set_bytes{service_name="otel-node"}
          / on (k8s_namespace_name, k8s_pod_name, k8s_container_name) group_left
          k8s_container_memory_limit_bytes
          > 0.9
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: "High memory usage in {{ $labels.k8s_container_name }}"
        description: >-
          Container {{ $labels.k8s_namespace_name }}/{{ $labels.k8s_pod_name }}/
          {{ $labels.k8s_container_name }} is using {{ $value | humanizePercentage }} of its limit

    - alert: PersistentVolumeClaimPending
      expr: |
        otel_k8s_pvc_phase{k8s_persistentvolumeclaim_status_phase="Pending"} == 1
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: >-
          PVC {{ $labels.k8s_namespace_name }}/
          {{ $labels.k8s_persistentvolumeclaim_name }} is pending
        description: The claim has been pending for 10 minutes
