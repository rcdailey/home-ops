---
# yaml-language-server: $schema=https://raw.githubusercontent.com/victoriametrics/operator/master/config/crd/bases/operator.victoriametrics.com_vmrules.yaml
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: cluster-health
spec:
  groups:
  - name: cluster-health
    interval: 30s
    rules:
    - alert: NodeDown
      expr: otel_k8s_node_condition{condition="Ready"} != 1
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: "Node {{ $labels.k8s_node_name }} is down"
        description: "Node {{ $labels.k8s_node_name }} has not been ready for 5 minutes"

    - alert: NodePressure
      expr: |
        otel_k8s_node_condition{condition=~"MemoryPressure|DiskPressure|PIDPressure"} == 1
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: "Node {{ $labels.k8s_node_name }} has {{ $labels.condition }}"

    - alert: NodeHighCPU
      expr: 100 * otel:node_cpu_usage:ratio > 80
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: "High CPU usage on {{ $labels.host_name }}"
        description: "CPU usage is above 80% for 10 minutes on {{ $labels.host_name }}"

    - alert: NodeHighMemory
      expr: 100 * otel:node_memory_usage:ratio > 90
      for: 10m
      labels:
        severity: critical
      annotations:
        summary: "High memory usage on {{ $labels.k8s_node_name }}"
        description: "Memory usage is above 90% for 10 minutes on {{ $labels.k8s_node_name }}"

    - alert: NodeDiskSpaceLow
      expr: |
        100 * sum by (host_name, mountpoint, device) (
          otel_system_filesystem_usage_bytes{state="used",type!="tmpfs"}
        )
          / sum by (host_name, mountpoint, device) (
            otel_system_filesystem_usage_bytes{type!="tmpfs"}
          ) > 85
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: "Disk usage above 85% on {{ $labels.host_name }}"
        description: "Filesystem {{ $labels.mountpoint }} is above 85% usage"

    - alert: NodeDiskSpaceCritical
      expr: |
        100 * sum by (host_name, mountpoint, device) (
          otel_system_filesystem_usage_bytes{state="used",type!="tmpfs"}
        )
          / sum by (host_name, mountpoint, device) (
            otel_system_filesystem_usage_bytes{type!="tmpfs"}
          ) > 95
      for: 10m
      labels:
        severity: critical
      annotations:
        summary: "Disk usage above 95% on {{ $labels.host_name }}"
        description: "Filesystem {{ $labels.mountpoint }} is above 95% usage"
