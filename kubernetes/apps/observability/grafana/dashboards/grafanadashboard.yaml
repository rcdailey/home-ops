---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: otel-kubernetes
spec:
  allowCrossNamespaceImport: true
  folder: Observability
  instanceSelector:
    matchLabels:
      grafana.internal/instance: grafana
  datasources:
  - datasourceName: VictoriaMetrics
    inputName: DS_PROMETHEUS
  configMapRef:
    name: otel-kubernetes-dashboard
    key: otel-kubernetes.json
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: etcd
spec:
  allowCrossNamespaceImport: true
  folder: General
  instanceSelector:
    matchLabels:
      grafana.internal/instance: grafana
  datasources:
  - datasourceName: VictoriaMetrics
    inputName: DS_PROMETHEUS
  configMapRef:
    name: etcd-dashboard
    key: etcd.json
