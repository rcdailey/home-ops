---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: victoria-metrics
spec:
  hostnames:
  - victoria-metrics.${SECRET_DOMAIN}
  parentRefs:
  - name: internal
    namespace: network
    sectionName: https
  rules:
  # Read-only allowlist for vmui and query clients. VictoriaMetrics serves write and admin APIs on
  # the same port without method checks, so any path missing here is blocked rather than exposed.
  - matches:
    - path:
        type: Exact
        value: /
    - path:
        value: /vmui
    - path:
        value: /vmalert
    - path:
        value: /api/v1/query
    - path:
        value: /api/v1/query_range
    - path:
        value: /api/v1/series
    - path:
        value: /api/v1/labels
    - path:
        value: /api/v1/label
    - path:
        value: /api/v1/export
    - path:
        value: /api/v1/status
    - path:
        value: /prettify-query
    - path:
        value: /expand-with-exprs
    - path:
        value: /metric-relabel-debug
    - path:
        value: /downsampling-filters-debug
    - path:
        value: /retention-filters-debug
    backendRefs:
    - name: vmsingle-vm
      port: 8428
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: victoria-metrics-unraid
spec:
  hostnames:
  - victoria-metrics.${SECRET_DOMAIN}
  parentRefs:
  - name: internal
    namespace: network
    sectionName: https
  rules:
  - matches:
    - path:
        type: Exact
        value: /api/v1/import/prometheus
    backendRefs:
    - name: vmsingle-vm
      port: 8428
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vmalert
spec:
  hostnames:
  - vmalert.${SECRET_DOMAIN}
  parentRefs:
  - name: internal
    namespace: network
    sectionName: https
  rules:
  - backendRefs:
    - name: vmalert-vm
      port: 8080
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vmalertmanager
spec:
  hostnames:
  - vmalertmanager.${SECRET_DOMAIN}
  parentRefs:
  - name: internal
    namespace: network
    sectionName: https
  rules:
  - backendRefs:
    - name: vmalertmanager-vm
      port: 9093
