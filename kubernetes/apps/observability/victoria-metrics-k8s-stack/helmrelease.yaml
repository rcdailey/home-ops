---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-metrics-k8s-stack
spec:
  interval: 30m
  timeout: 20m
  chartRef:
    kind: OCIRepository
    name: victoria-metrics-k8s-stack
  values:
    fullnameOverride: vm

    # Disable Grafana since we're using separate deployment
    grafana:
      enabled: false

    defaultDashboards:
      enabled: false

    # Memory sizing rationale (2025-10-17):
    # - Increased from 2Gi to 4Gi to resolve query timeout issues
    # - 2Gi reached 86% usage and caused query data-block timeouts
    # - VictoriaMetrics official docs recommend 4-10Gi for production workloads
    # - Default -memory.allowedPercent is 60% of container limit for internal caches
    vmsingle:
      enabled: true
      spec:
        disableSelfServiceScrape: true
        retentionPeriod: "14d"
        replicaCount: 1
        storage:
          accessModes:
          - ReadWriteOnce
          resources:
            requests:
              storage: 30Gi
          storageClassName: ceph-block
        resources:
          limits:
            memory: 4Gi
          requests:
            cpu: 100m
            memory: 512Mi
        extraArgs:
          opentelemetry.usePrometheusNaming: "true"
        livenessProbe:
          httpGet:
            path: /health
            port: 8428

    # Disable VMCluster for single-node deployment
    vmcluster:
      enabled: false

    # AlertManager configuration
    alertmanager:
      enabled: true
      spec:
        disableSelfServiceScrape: true
        disableNamespaceMatcher: true
        externalURL: https://vmalertmanager.${SECRET_DOMAIN}
        replicaCount: 1
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: ceph-block
              accessModes:
              - ReadWriteOnce
              resources:
                requests:
                  storage: 1Gi
        resources:
          limits:
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 32Mi
        configReloaderResources:
          limits:
            memory: 64Mi
          requests:
            cpu: 10m
            memory: 25Mi

    # VMAlert configuration
    vmalert:
      enabled: true
      spec:
        disableSelfServiceScrape: true
        evaluationInterval: 15s
        selectAllByDefault: false
        ruleNamespaceSelector: {}
        ruleSelector:
          matchLabels:
            observability.home-ops/datasource: metrics
        datasource:
          url: http://vmsingle-vm.observability:8428
        remoteWrite:
          url: http://vmsingle-vm.observability:8428
        remoteRead:
          url: http://vmsingle-vm.observability:8428
        resources:
          limits:
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 32Mi
        configReloaderResources:
          limits:
            memory: 64Mi
          requests:
            cpu: 10m
            memory: 25Mi
        extraArgs:
          # Override chart defaults to enable automatic API path appending
          # Without this, VMAlert sends requests to "/" instead of "/api/v1/write"
          # Reference: https://docs.victoriametrics.com/vmalert/#remote-write
          remoteWrite.disablePathAppend: "false"
          external.url: https://vmalert.${SECRET_DOMAIN}

    vmagent:
      enabled: false

    prometheus-node-exporter:
      enabled: false

    kube-state-metrics:
      enabled: true
      vmScrape:
        enabled: false
      collectors: []
      prometheus:
        monitor:
          enabled: true
      customResourceState:
        enabled: true
        config:
          kind: CustomResourceStateMetrics
          spec:
            resources:
            - groupVersionKind:
                group: volsync.backube
                version: v1alpha1
                kind: ReplicationSource
              metricNamePrefix: volsync
              labelsFromPath:
                namespace: [metadata, namespace]
                replicationsource: [metadata, name]
              metrics:
              - name: replicationsource_info
                help: Information about a VolSync ReplicationSource.
                each:
                  type: Info
                  info: {}
              - name: replicationsource_last_sync_time
                help: Unix timestamp of the last completed VolSync synchronization.
                each:
                  type: Gauge
                  gauge:
                    path: [status, lastSyncTime]
              - name: replicationsource_latest_mover_status
                help: Result of the latest VolSync mover job.
                each:
                  type: StateSet
                  stateSet:
                    path: [status, latestMoverStatus, result]
                    labelName: result
                    list: [Successful, Failed]
      rbac:
        extraRules:
        - apiGroups: [volsync.backube]
          resources: [replicationsources]
          verbs: [list, watch]
      resources:
        limits:
          memory: 128Mi
        requests:
          cpu: 10m
          memory: 32Mi

    defaultRules:
      enabled: false

    kubeApiServer:
      enabled: false

    kubeControllerManager:
      enabled: false

    kubeScheduler:
      enabled: false

    kubeEtcd:
      enabled: false

    coreDns:
      enabled: false

    kubeProxy:
      enabled: false

    kubelet:
      enabled: false

    victoria-metrics-operator:
      enabled: true
      fullnameOverride: vm-operator
      operator:
        disable_prometheus_converter: true
      serviceMonitor:
        enabled: true
      resources:
        limits:
          memory: 256Mi
        requests:
          cpu: 50m
          memory: 64Mi
